# Render Blueprint (ADR 0026): one web service built from the root Dockerfile (the React app
# served by Rails, with the API) and a Postgres, both in Singapore so they talk over Render's
# private network. Create it from the Render dashboard: New → Blueprint → this repository.

services:
  - type: web
    name: horizon
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Rails' liveness check. assume_ssl means it isn't redirected to HTTPS.
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: horizon-db
          property: connectionString
      # Asked for when the Blueprint is created: the contents of backend/config/master.key.
      - key: RAILS_MASTER_KEY
        sync: false
      # Loads the demo data (10,000 employees) on the first boot; later boots skip employees.
      - key: SEED_ON_BOOT
        value: "true"

databases:
  - name: horizon-db
    plan: free
    region: singapore
    databaseName: horizon
    user: horizon
    postgresMajorVersion: "17"
